name: Generate Contribution Tetris

on:
  schedule:
    - cron: "30 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Tetris contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/contribution-tetris.svg
          tetromino_count: "7"
          palette: "auto"
          animation_duration: "8"

      - name: Publish Tetris graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: tetris-output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
